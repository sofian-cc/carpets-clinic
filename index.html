function Placeholder({ label, palette = 'warm', style, className = '' }) {
  const palettes = {
    warm:  { bg: '#e6e9ef', stripe: '#d2d8e2', accent: '#3d5a87' },
    cream: { bg: '#f1f2f4', stripe: '#e2e4e8', accent: '#3d5a87' },
    deep:  { bg: '#2d3245', stripe: '#3a4055', accent: '#aebed6' },
    sage:  { bg: '#d6dadf', stripe: '#c1c6cd', accent: '#3d5a87' },
    rose:  { bg: '#dcd9e0', stripe: '#c8c4cd', accent: '#3d5a87' },
    blue:  { bg: '#bfc8d6', stripe: '#aab5c5', accent: '#2d4670' },
  };
  const p = palettes[palette] || palettes.warm;
  const id = 'ph' + Math.random().toString(36).slice(2, 8);
  return (
    <div className={`ph-tile ${className}`} style={style}>
      <svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
        <defs>
          <pattern id={id + 's'} width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <rect width="6" height="6" fill={p.bg}/>
            <line x1="0" y1="0" x2="0" y2="6" stroke={p.stripe} strokeWidth="2"/>
          </pattern>
          <pattern id={id + 'w'} width="14" height="14" patternUnits="userSpaceOnUse">
            <rect width="14" height="14" fill={p.bg}/>
            <path d="M0 7L14 7M7 0L7 14" stroke={p.stripe} strokeWidth="0.6" opacity="0.55"/>
            <circle cx="7" cy="7" r="0.7" fill={p.accent} opacity="0.35"/>
          </pattern>
        </defs>
        <rect width="400" height="300" fill={`url(#${id}s)`}/>
        <rect width="400" height="300" fill={`url(#${id}w)`} opacity="0.6"/>
        <rect x="14" y="14" width="372" height="272" fill="none" stroke={p.accent} strokeWidth="0.5" opacity="0.4"/>
        {label && (
          <text x="20" y="280" fontFamily="JetBrains Mono, monospace" fontSize="10" letterSpacing="2" fill={p.accent} opacity="0.7" textTransform="uppercase">{label.toUpperCase()}</text>
        )}
      </svg>
    </div>
  );
}

function Nav({ route, setRoute }) {
  const [scrolled, setScrolled] = useState(false);
  const [open, setOpen] = useState(false);

  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 8);
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  const links = [
    ['home', 'Home'],
    ['services', 'Services'],
    ['gallery', 'Gallery'],
    ['about', 'About'],
    ['contact', 'Contact'],
  ];

  const go = (r) => { setRoute(r); setOpen(false); window.scrollTo({ top: 0, behavior: 'instant' }); };

  return (
    <nav className={`nav ${scrolled ? 'scrolled' : ''}`}>
      <div className="shell nav-inner">
        <button className="logo" onClick={() => go('home')} aria-label="Carpets Clinic home">

function BeforeAfter({ imgBefore, imgAfter, palBefore = 'rose', palAfter = 'warm', label }) {
  const [split, setSplit] = useState(50);
  const ref = useRef(null);
  const dragging = useRef(false);

  const onMove = (clientX) => {
    if (!ref.current) return;
    const r = ref.current.getBoundingClientRect();
    setSplit(Math.max(4, Math.min(96, ((clientX - r.left) / r.width) * 100)));
  };

  return (
    <div
      className="beforeafter"
      style={{ aspectRatio: '4/3', '--split': split + '%' }}
      ref={ref}
      onMouseDown={e => { dragging.current = true; onMove(e.clientX); }}
      onMouseMove={e => { if (dragging.current) onMove(e.clientX); }}
      onMouseUp={() => { dragging.current = false; }}
      onMouseLeave={() => { dragging.current = false; }}
      onTouchStart={e => onMove(e.touches[0].clientX)}
      onTouchMove={e => { e.preventDefault(); onMove(e.touches[0].clientX); }}
    >
      <div className="pane before">
        {imgBefore ? <img src={imgBefore} alt="Before" /> : <Placeholder palette={palBefore} style={{width:'100%',height:'100%'}}/>}
      </div>
      <div className="pane after">
        {imgAfter ? <img src={imgAfter} alt="After" /> : <Placeholder palette={palAfter} style={{width:'100%',height:'100%'}}/>}
      </div>
      <div className="ba-label left">Before</div>
      <div className="ba-label right">After</div>
      <div className="handle"></div>
    </div>
  );
}

                  By appointment only — we work better when we're expecting you.
                </div>
              </div>
              <div className="contact-block">
                <div className="label">Nationwide service</div>
                <div style={{fontSize:14, color:'var(--charcoal-soft)', lineHeight:1.55}}>
                  Insured collection &amp; delivery anywhere on the UK mainland. Onsite work routinely undertaken in London, Bath, Manchester, Edinburgh, Cotswolds &amp; the Home Counties.
                </div>

}

/* ================================================================
   APP — ROUTER
   ================================================================ */
const ROUTES = ['home', 'services', 'gallery', 'about', 'contact'];

function App() {
  const initial = ((window.location.hash || '').replace('#', ''));
  const [route, setRouteRaw] = useState(ROUTES.includes(initial) ? initial : 'home');

  const setRoute = (r) => {
    setRouteRaw(r);
    window.location.hash = r;
  };

  useEffect(() => {
    const onHash = () => {
      const h = (window.location.hash || '').replace('#', '');
      if (ROUTES.includes(h)) setRouteRaw(h);
    };
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  const pages = { home: Home, services: Services, gallery: Gallery, about: About, contact: Contact };
  const Page = pages[route] || Home;

  return (
    <div>
      <Nav route={route} setRoute={setRoute} />
      <Page key={route} setRoute={setRoute} />
      <Footer setRoute={setRoute} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
